<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingertip Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255,255,255,0.7);
      font: 600 13px/1 "SF Mono", "Fira Code", ui-monospace, monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,180,255,0.3);
      pointer-events: none;
      text-align: center;
      white-space: pre;
    }
    #boot {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.92);
      z-index: 20;
      text-align: center;
      gap: 16px;
    }
    #boot h1 {
      color: #7fdfff;
      font: 600 clamp(1.2rem, 3vw, 2.4rem)/1.2 "SF Mono", monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    #boot p {
      color: #7fa3c0;
      font: 14px/1.5 "SF Mono", monospace;
      max-width: 32ch;
    }
    #boot button {
      margin-top: 8px;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      background: rgba(14,30,50,0.9);
      color: #e8f3ff;
      font: 600 13px/1 "SF Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #boot button:hover { background: rgba(26,58,87,0.96); }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="hud">aguardando duas maos...</div>
    <div id="boot">
      <h1>Fingertip Screen</h1>
      <p>Use thumb + index finger on both hands to create a collaborative thermal viewport.</p>
      <button id="enterBtn">INICIAR</button>
    </div>
  </div>

  <video id="video" playsinline muted style="display:none;"></video>
  <canvas id="offscreen" style="display:none;"></canvas>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const VIDEO_W = 1280;
    const VIDEO_H = 720;
    const THERMAL_SCALE = 0.25;
    const TW = (VIDEO_W * THERMAL_SCALE) | 0;
    const TH = (VIDEO_H * THERMAL_SCALE) | 0;
    const MODEL_URL = 'https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task';
    const ASSETS_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';

    const video = document.getElementById('video');
    const viewport = document.getElementById('viewport');
    const offscreen = document.getElementById('offscreen');
    const ctx = viewport.getContext('2d');
    const offCtx = offscreen.getContext('2d');
    const hud = document.getElementById('hud');
    const boot = document.getElementById('boot');
    const enterBtn = document.getElementById('enterBtn');

    offscreen.width = TW;
    offscreen.height = TH;

    let landmarker = null;
    let stream = null;
    let running = false;
    let raf = null;
    let cameraReady = false;

    const thermalBuf = document.createElement('canvas');
    thermalBuf.width = TW;
    thermalBuf.height = TH;
    const thermalCtx = thermalBuf.getContext('2d');

    enterBtn.addEventListener('click', async () => {
      boot.style.display = 'none';
      await start();
    });

    async function start() {
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: VIDEO_W, height: VIDEO_H }, audio: false
        });
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        await video.play();
        await new Promise((res) => {
          const check = () => {
            if (video.videoWidth && video.videoHeight) { cameraReady = true; res(); }
            else requestAnimationFrame(check);
          };
          check();
        });
      }
      if (!landmarker) {
        const vision = await FilesetResolver.forVisionTasks(ASSETS_URL);
        landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL },
          runningMode: 'VIDEO',
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6,
          minHandPresenceConfidence: 0.5
        });
      }
      if (!running) {
        running = true;
        loop();
      }
    }

    function loop() {
      if (!running) return;
      draw().catch(console.warn).finally(() => { raf = requestAnimationFrame(loop); });
    }

    async function draw() {
      const vw = viewport.width = viewport.clientWidth * devicePixelRatio;
      const vh = viewport.height = viewport.clientHeight * devicePixelRatio;

      if (!cameraReady || video.readyState < 2) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, vw, vh);
        return;
      }

      let landmarks = null;
      try {
        const res = await landmarker.detectForVideo(video, performance.now());
        const hands = res?.landmarks ?? [];
        if (hands.length === 2) {
          landmarks = hands;
        }
      } catch (e) { /* skip frame */ }

      if (!landmarks) {
        ctx.drawImage(video, 0, 0, vw, vh);
        hud.textContent = 'aguardando duas maos...';
        return;
      }

      const tips = [];
      for (const hand of landmarks) {
        tips.push({ x: hand[4].x * VIDEO_W, y: hand[4].y * VIDEO_H });
        tips.push({ x: hand[8].x * VIDEO_W, y: hand[8].y * VIDEO_H });
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of tips) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const pad = 12;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(VIDEO_W, maxX + pad);
      maxY = Math.min(VIDEO_H, maxY + pad);

      const sx = vw / VIDEO_W;
      const sy = vh / VIDEO_H;

      const rx = minX * sx;
      const ry = minY * sy;
      const rw = (maxX - minX) * sx;
      const rh = (maxY - minY) * sy;

      const tw = (maxX - minX) * THERMAL_SCALE;
      const th = (maxY - minY) * THERMAL_SCALE;
      const tx = minX * THERMAL_SCALE;
      const ty = minY * THERMAL_SCALE;

      offCtx.drawImage(video,
        tx, ty, tw, th,
        0, 0, TW, TH
      );
      const imgData = offCtx.getImageData(0, 0, TW, TH);
      applyThermal(imgData);
      thermalCtx.putImageData(imgData, 0, 0);

      ctx.drawImage(video, 0, 0, vw, vh);

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 6);
      ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'medium';
      ctx.drawImage(thermalBuf, 0, 0, TW, TH, rx, ry, rw, rh);
      ctx.restore();

      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,200,255,0.4)';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 6);
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (const p of tips) {
        const px = p.x * sx;
        const py = p.y * sy;
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,255,200,0.9)';
        ctx.shadowColor = 'rgba(0,255,200,0.6)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      hud.textContent = 'JANELA ATIVA';
    }

    function applyThermal(imgData) {
      const d = imgData.data;
      const len = d.length;
      for (let i = 0; i < len; i += 4) {
        const lum = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
        const t = lum / 255;
        const [r, g, b] = thermalLut(t);
        d[i] = r;
        d[i + 1] = g;
        d[i + 2] = b;
      }
    }

    function thermalLut(t) {
      if (t < 0.15) {
        const f = t / 0.15;
        return [10 * f | 0, 10 + f * 40 | 0, 80 + f * 120 | 0];
      }
      if (t < 0.35) {
        const f = (t - 0.15) / 0.2;
        return [10 + f * 20 | 0, 50 + f * 145 | 0, 200 + f * 55 | 0];
      }
      if (t < 0.55) {
        const f = (t - 0.35) / 0.2;
        return [30 + f * 60 | 0, 195 + f * 60 | 0, 255 - f * 130 | 0];
      }
      if (t < 0.75) {
        const f = (t - 0.55) / 0.2;
        return [90 + f * 120 | 0, 255 - f * 30 | 0, 125 - f * 100 | 0];
      }
      const f = (t - 0.75) / 0.25;
      return [210 + f * 45 | 0, 225 - f * 120 | 0, 25 + f * 10 | 0];
    }

    if (!('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices)) {
      enterBtn.disabled = true;
      boot.querySelector('p').textContent = 'Camera access required. Use a modern browser.';
    }
  </script>
</body>
</html>

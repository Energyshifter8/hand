<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermal Hand Tracker Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #061017;
      --surface: rgba(10,20,34,0.92);
      --text: #e8f3ff;
      --muted: #7fa3c0;
      --accent: #ff5f45;
      --green: #4cff96;
      --warn: #f0b24f;
      --outline: rgba(255, 255, 255, 0.8);
      font-family: "Source Code Pro", "Fira Code", ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(30, 75, 116, 0.24), transparent 24%),
                  radial-gradient(circle at 20% 80%, rgba(255, 95, 69, 0.12), transparent 18%),
                  var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    #app {
      position: relative;
      width: min(1080px, 100vw - 40px);
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(2, 10, 22, 0.96);
      box-shadow: 0 28px 80px rgba(0,0,0,0.38);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    #controls {
      position: absolute;
      right: 18px;
      top: 18px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    button {
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(14, 30, 50, 0.9);
      color: var(--text);
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      font: inherit;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    button:hover {
      background: rgba(26, 58, 87, 0.96);
      transform: translateY(-1px);
    }

    #boot {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(4, 9, 18, 0.92);
      z-index: 15;
      text-align: center;
      gap: 18px;
      padding: 32px;
    }

    #boot h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 3rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7fdfff;
      text-shadow: 0 0 18px rgba(127,223,255,0.24);
    }

    #boot p {
      margin: 0;
      color: var(--muted);
      max-width: 26rem;
      line-height: 1.55;
    }

    #boot button {
      min-width: 180px;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
    }

    .hud-text {
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-shadow: 0 0 16px rgba(0, 160, 255, 0.16);
      line-height: 1.4;
      white-space: pre;
    }

    #hud-top,
    #hud-bottom {
      position: absolute;
      z-index: 8;
      pointer-events: none;
      width: calc(100% - 40px);
      padding: 16px 20px;
    }

    #hud-top {
      top: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    #hud-bottom {
      bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .hud-block {
      display: inline-grid;
      gap: 6px;
      background: rgba(8, 14, 26, 0.72);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.18);
      padding: 12px 14px;
      border-radius: 14px;
    }

    .hud-label {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      opacity: 0.9;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.18);
    }

    #debug {
      position: absolute;
      left: 18px;
      top: 110px;
      z-index: 12;
      pointer-events: none;
      width: auto;
      max-width: calc(100% - 60px);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport" width="1280" height="720"></canvas>
    <div id="hud-top">
      <div class="hud-block hud-text" id="hud-left"></div>
      <div class="hud-block hud-text" id="hud-right"></div>
    </div>
    <div id="hud-bottom">
      <div class="hud-block hud-text" id="hud-state"></div>
      <div class="hud-block hud-text" id="hud-view"></div>
    </div>
    <div id="controls">
      <button id="toggleBtn">Start Camera</button>
    </div>
    <div id="debug" class="hud-block hud-text">STATUS: waiting</div>
    <div id="boot">
      <h1>THERMAL HAND SCAN</h1>
      <p>Retro terminal thermal effect with live MediaPipe hand landmark tracking, scanned region, and HUD overlay. Click ENTRAR to initialize the camera.</p>
      <button id="enterBtn">ENTRAR</button>
    </div>
  </div>

  <video id="video" playsinline muted style="display:none;"></video>
  <canvas id="hiddenCanvas" width="1280" height="720" style="display:none;"></canvas>
  <canvas id="thermalCanvas" width="1280" height="720" style="display:none;"></canvas>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const VIDEO_WIDTH = 1280;
    const VIDEO_HEIGHT = 720;
    const modelAssetPath = 'https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task';
    const assetsPath = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';

    const video = document.getElementById('video');
    const viewport = document.getElementById('viewport');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const thermalCanvas = document.getElementById('thermalCanvas');
    const ctx = viewport.getContext('2d');
    const hiddenCtx = hiddenCanvas.getContext('2d');
    const thermalCtx = thermalCanvas.getContext('2d');

    const hudLeft = document.getElementById('hud-left');
    const hudRight = document.getElementById('hud-right');
    const hudState = document.getElementById('hud-state');
    const hudView = document.getElementById('hud-view');
    const debugPanel = document.getElementById('debug');
    const toggleBtn = document.getElementById('toggleBtn');
    const boot = document.getElementById('boot');
    const enterBtn = document.getElementById('enterBtn');

    let handLandmarker = null;
    let cameraStream = null;
    let running = false;
    let animationHandle = null;
    let seedHex = generateSeed();
    let hudJson = {
      seed: seedHex,
      area: '00%',
      tmax: '28°C',
      state: 'IDLE',
      view: 'SCAN',
      dot: '#7f8fa4'
    };
    let lastBox = null;
    let motionScalar = 0;
    let cameraReady = false;
    let debugText = 'idle';

    const shapeState = {
      center: { x: VIDEO_WIDTH / 2, y: VIDEO_HEIGHT / 2 },
      angle: 0,
      width: VIDEO_WIDTH * 0.45,
      height: VIDEO_HEIGHT * 0.45
    };

    enterBtn.addEventListener('click', async () => {
      boot.style.display = 'none';
      await initCameraPipeline();
    });

    toggleBtn.addEventListener('click', async () => {
      if (running) {
        stopCamera();
      } else {
        await initCameraPipeline();
      }
    });

    async function initCameraPipeline() {
      toggleBtn.disabled = true;
      if (!cameraStream) {
        cameraStream = await openCamera();
      }

      if (!handLandmarker) {
        await loadMediaPipe();
      }

      if (!running) {
        running = true;
        toggleBtn.textContent = 'Stop Camera';
        animateFrame();
      }
      toggleBtn.disabled = false;
    }

    async function openCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: VIDEO_WIDTH, height: VIDEO_HEIGHT }, audio: false });
      video.srcObject = stream;
      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;
      debugText = 'camera granted';
      updateDebug();
      await video.play();
      await waitForVideoReady();
      cameraReady = !!(video.videoWidth && video.videoHeight);
      debugText = cameraReady ? 'camera ready' : 'camera no frame';
      updateDebug();
      return stream;
    }

    function waitForVideoReady() {
      return new Promise((resolve, reject) => {
        if (video.readyState >= 3 && video.videoWidth && video.videoHeight) {
          resolve();
          return;
        }

        const timeout = setTimeout(() => {
          video.removeEventListener('loadedmetadata', onReady);
          video.removeEventListener('canplay', onReady);
          video.removeEventListener('canplaythrough', onReady);
          reject(new Error('Video did not become ready in time'));
        }, 8000);

        const onReady = () => {
          if (video.videoWidth && video.videoHeight) {
            clearTimeout(timeout);
            video.removeEventListener('loadedmetadata', onReady);
            video.removeEventListener('canplay', onReady);
            video.removeEventListener('canplaythrough', onReady);
            resolve();
          }
        };

        video.addEventListener('loadedmetadata', onReady, { once: true });
        video.addEventListener('canplay', onReady, { once: true });
        video.addEventListener('canplaythrough', onReady, { once: true });
      });
    }

    function stopCamera() {
      running = false;
      toggleBtn.textContent = 'Start Camera';
      if (animationHandle) {
        cancelAnimationFrame(animationHandle);
        animationHandle = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      handLandmarker = handLandmarker;
      ctx.fillStyle = '#040c18';
      ctx.fillRect(0, 0, viewport.width, viewport.height);
      hudJson.state = 'IDLE';
      hudJson.dot = '#7f8fa4';
      updateHudOverlay();
    }

    async function loadMediaPipe() {
      try {
        debugText = 'loading model';
        updateDebug();
        const vision = await FilesetResolver.forVisionTasks(assetsPath);
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath },
          runningMode: 'VIDEO',
          numHands: 1,
          minHandDetectionConfidence: 0.75,
          minTrackingConfidence: 0.75,
          minHandPresenceConfidence: 0.75
        });
        debugText = 'model loaded';
        hudJson.state = 'ACTIVE';
        hudJson.dot = '#4cff96';
        updateDebug();
        updateHudOverlay();
      } catch (error) {
        console.error('MediaPipe load failed:', error);
        debugText = 'model load failed';
        updateDebug();
        throw error;
      }
    }

    function animateFrame() {
      if (!running) {
        return;
      }

      drawFrame()
        .catch((error) => {
          console.warn('Frame processing error:', error);
          debugText = 'frame error';
          updateDebug();
        })
        .finally(() => {
          animationHandle = requestAnimationFrame(animateFrame);
        });
    }

    async function drawFrame() {
      hiddenCanvas.width = VIDEO_WIDTH;
      hiddenCanvas.height = VIDEO_HEIGHT;
      thermalCanvas.width = VIDEO_WIDTH;
      thermalCanvas.height = VIDEO_HEIGHT;

      ctx.clearRect(0, 0, viewport.width, viewport.height);
      ctx.fillStyle = '#040c18';
      ctx.fillRect(0, 0, viewport.width, viewport.height);

      if (!cameraReady || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
        debugText = `waiting for video (${video.readyState}/${video.videoWidth}x${video.videoHeight})`;
        updateDebug();
        return;
      }

      hiddenCtx.drawImage(video, 0, 0, VIDEO_WIDTH, VIDEO_HEIGHT);
      const imageData = hiddenCtx.getImageData(0, 0, VIDEO_WIDTH, VIDEO_HEIGHT);
      thermalCtx.putImageData(applyThermalColormap(imageData), 0, 0);
      ctx.drawImage(video, 0, 0, viewport.width, viewport.height);

      let boxInfo = null;
      try {
        const result = await handLandmarker.detectForVideo(video, performance.now());
        const landmarks = result?.landmarks?.[0] ?? [];
        boxInfo = landmarks.length ? computeRotatedBoundingBox(landmarks) : null;
      } catch (error) {
        console.warn('HandLandmarker detect error:', error);
        debugText = 'detection error';
        updateDebug();
      }

      if (boxInfo) {
        lastBox = boxInfo;
        motionScalar = computeMotion(boxInfo);
        drawThermalScanBox(boxInfo);
      } else {
        motionScalar = Math.max(0, motionScalar * 0.92 - 0.02);
      }

      updateHudData(boxInfo);
      drawHudOverlay();
    }

    function computeRotatedBoundingBox(landmarks) {
      const coords = landmarks.map((pt) => ({ x: pt.x * VIDEO_WIDTH, y: pt.y * VIDEO_HEIGHT }));
      const xValues = coords.map((p) => p.x);
      const yValues = coords.map((p) => p.y);
      const minX = Math.min(...xValues);
      const maxX = Math.max(...xValues);
      const minY = Math.min(...yValues);
      const maxY = Math.max(...yValues);
      const width = Math.max((maxX - minX) * 1.3, 120);
      const height = Math.max((maxY - minY) * 1.6, 120);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const direction = getDirectionVector(coords);
      const angle = Math.atan2(direction.y, direction.x);

      return { cx, cy, width, height, angle };
    }

    function getDirectionVector(coords) {
      if (coords.length < 2) {
        return { x: 1, y: 0 };
      }
      const wrist = coords[0];
      const fingertip = coords[9] ?? coords[1];
      return {
        x: fingertip.x - wrist.x,
        y: fingertip.y - wrist.y
      };
    }

    function computeMotion(boxInfo) {
      if (!lastBox) {
        return 0.08;
      }
      const dx = Math.abs(boxInfo.cx - lastBox.cx);
      const dy = Math.abs(boxInfo.cy - lastBox.cy);
      return Math.min(1, Math.max(0, (dx + dy) / 40));
    }

    function drawThermalScanBox(boxInfo) {
      const scaled = scaleBoxToViewport(boxInfo);
      ctx.save();
      ctx.translate(scaled.cx, scaled.cy);
      ctx.rotate(scaled.angle);
      ctx.beginPath();
      ctx.rect(-scaled.width / 2, -scaled.height / 2, scaled.width, scaled.height);
      ctx.clip();
      ctx.globalAlpha = 0.96;
      ctx.drawImage(thermalCanvas, 0, 0, viewport.width, viewport.height);
      ctx.globalAlpha = 1;
      ctx.restore();
      drawScanFrame(scaled);
    }

    function drawScanFrame(box) {
      const border = 2;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.lineWidth = border;
      ctx.translate(box.cx, box.cy);
      ctx.rotate(box.angle);
      ctx.strokeRect(-box.width / 2, -box.height / 2, box.width, box.height);
      drawCornerBracket(-box.width / 2, -box.height / 2, 22, 18);
      drawCornerBracket(box.width / 2, -box.height / 2, -22, 18);
      drawCornerBracket(-box.width / 2, box.height / 2, 22, -18);
      drawCornerBracket(box.width / 2, box.height / 2, -22, -18);
      ctx.restore();
    }

    function drawCornerBracket(x, y, offsetX, offsetY) {
      ctx.beginPath();
      ctx.moveTo(x + Math.sign(offsetX) * 4, y);
      ctx.lineTo(x + offsetX, y);
      ctx.lineTo(x + offsetX, y + offsetY);
      ctx.stroke();
    }

    function scaleBoxToViewport(box) {
      const scaleX = viewport.width / VIDEO_WIDTH;
      const scaleY = viewport.height / VIDEO_HEIGHT;
      return {
        cx: box.cx * scaleX,
        cy: box.cy * scaleY,
        width: box.width * scaleX,
        height: box.height * scaleY,
        angle: box.angle
      };
    }

    function applyThermalColormap(imageData) {
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const luminance = 0.2989 * r + 0.587 * g + 0.114 * b;
        const normalized = Math.min(1, Math.max(0, luminance / 255));
        const [cr, cg, cb] = paletteLut(normalized);
        data[i] = cr;
        data[i + 1] = cg;
        data[i + 2] = cb;
      }
      return imageData;
    }

    function paletteLut(t) {
      if (t < 0.2) {
        return [36, 82 + t * 170, 255];
      }
      if (t < 0.4) {
        return [36, 255, 140 + (t - 0.2) * 575];
      }
      if (t < 0.65) {
        return [120 + (t - 0.4) * 540, 255, 24];
      }
      if (t < 0.85) {
        return [255, 200 + (t - 0.65) * 275, 60];
      }
      return [255, 80 + (t - 0.85) * 300, 24 + (t - 0.85) * 80];
    }

    function updateHudData(boxInfo) {
      const areaPct = boxInfo ? Math.round((boxInfo.width * boxInfo.height) / (VIDEO_WIDTH * VIDEO_HEIGHT) * 100) : 0;
      const temp = boxInfo ? 32 + Math.round(Math.min(28, areaPct * 0.45 + motionScalar * 30)) : 24;
      hudJson = {
        seed: seedHex,
        area: `${String(areaPct).padStart(2, '0')}%`,
        tmax: `${temp}°C`,
        state: boxInfo ? 'ACTIVE' : 'IDLE',
        view: boxInfo ? 'HAND' : 'WAIT',
        dot: boxInfo ? '#4cff96' : '#7f8fa4'
      };
      fakeSocketUpdate(JSON.parse(JSON.stringify(hudJson)));
    }

    function fakeSocketUpdate(payload) {
      hudJson = payload;
    }

    function drawHudOverlay() {
      hudLeft.textContent = `HAND.SYS_08 - CALOR\nSEED: ${hudJson.seed}`;
      hudRight.textContent = `AREA: ${hudJson.area}\nTMAX: ${hudJson.tmax}`;
      hudState.innerHTML = `<span class="status-dot" style="background:${hudJson.dot};"></span>STATE: ${hudJson.state}`;
      hudView.textContent = `VIEW: ${hudJson.view}`;
      updateDebug();
    }

    function updateHudOverlay() {
      drawHudOverlay();
    }

    function updateDebug() {
      debugPanel.textContent = `STATUS: ${debugText}`;
    }

    function generateSeed() {
      return Math.floor(Math.random() * 0xffffff).toString(16).toUpperCase().padStart(6, '0');
    }

    if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
      toggleBtn.disabled = false;
    } else {
      toggleBtn.disabled = true;
      boot.querySelector('p').textContent = 'Webcam access is required. Please open this page in a secure browser that supports getUserMedia().';
    }

    updateHudOverlay();
  </script>
</body>
</html>

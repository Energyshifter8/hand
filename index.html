<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingertip Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(0,255,255,0.85);
      font: 600 12px/1 "SF Mono", "Fira Code", ui-monospace, monospace;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0,255,255,0.4), 0 0 28px rgba(0,255,255,0.15);
      pointer-events: none;
      text-align: center;
      white-space: pre;
      background: rgba(0,20,40,0.55);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 6px;
      padding: 8px 20px;
      backdrop-filter: blur(4px);
    }
    #boot {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.92);
      z-index: 20;
      text-align: center;
      gap: 16px;
    }
    #boot h1 {
      color: #7fdfff;
      font: 600 clamp(1.2rem, 3vw, 2.4rem)/1.2 "SF Mono", monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    #boot p {
      color: #7fa3c0;
      font: 14px/1.5 "SF Mono", monospace;
      max-width: 32ch;
    }
    #boot button {
      margin-top: 8px;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      background: rgba(14,30,50,0.9);
      color: #e8f3ff;
      font: 600 13px/1 "SF Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #boot button:hover { background: rgba(26,58,87,0.96); }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="hud">aguardando duas maos...</div>
    <div id="boot">
      <h1>Fingertip Screen</h1>
      <p>Use thumb + index finger on both hands to create a collaborative thermal viewport. Hold K or click/tap canvas to activate Kamui overlay.</p>
      <button id="enterBtn">INICIAR</button>
    </div>
  </div>

  <video id="video" playsinline muted style="display:none;"></video>
  <canvas id="offscreen" style="display:none;"></canvas>

  <script type="module">
    import { FilesetResolver, HandLandmarker, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const VIDEO_W = 1280;
    const VIDEO_H = 720;
    const MODEL_URL = 'https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task';
    const FACE_MODEL_URL = 'https://storage.googleapis.com/mediapipe-assets/face_landmarker.task';
    const ASSETS_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';

    const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10];

    const KAMUI_ARM_COLOR = '#e8580c';
    const KAMUI_ARM_ALT = '#ff6a00';
    const KAMUI_FADE_SPEED = 4.0;
    const KAMUI_ARMS = 4;
    const KAMUI_TWIST = 7;
    const KAMUI_SPIRAL_STEP = 0.012;
    const KAMUI_IDLE_ROT_SPEED = 0.05;
    const KAMUI_MAX_ROT_SPEED = 2.5;
    const MAX_PARTICLES = 40;

    const video = document.getElementById('video');
    const viewport = document.getElementById('viewport');
    const offscreen = document.getElementById('offscreen');
    const ctx = viewport.getContext('2d');
    const offCtx = offscreen.getContext('2d');
    const hud = document.getElementById('hud');
    const boot = document.getElementById('boot');
    const enterBtn = document.getElementById('enterBtn');

    const thermalBuf = document.createElement('canvas');
    const thermalCtx = thermalBuf.getContext('2d');
    const spiralBuf = document.createElement('canvas');
    const spiralCtx = spiralBuf.getContext('2d');
    const frameBuf = document.createElement('canvas');
    const frameCtx = frameBuf.getContext('2d');
    const maskBuf = document.createElement('canvas');
    const maskCtx = maskBuf.getContext('2d');

    let landmarker = null;
    let faceLandmarker = null;
    let stream = null;
    let running = false;
    let raf = null;
    let cameraReady = false;
    let faceReady = false;
    let faceLandmarks = null;
    let kamuiTrigger = false;
    let kamuiIntensity = 0;
    let rotationOffset = 0;
    let faceSkipCounter = 0;
    let lastFrameTime = 0;
    let particles = [];
    let perfWarned = false;

    enterBtn.addEventListener('click', async () => {
      boot.style.display = 'none';
      await start();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'k' || e.key === 'K') kamuiTrigger = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'k' || e.key === 'K') kamuiTrigger = false;
    });
    viewport.addEventListener('mousedown', () => { kamuiTrigger = true; });
    viewport.addEventListener('mouseup', () => { kamuiTrigger = false; });
    viewport.addEventListener('mouseleave', () => { kamuiTrigger = false; });
    viewport.addEventListener('touchstart', (e) => { e.preventDefault(); kamuiTrigger = true; }, { passive: false });
    viewport.addEventListener('touchend', () => { kamuiTrigger = false; });
    viewport.addEventListener('touchcancel', () => { kamuiTrigger = false; });

    async function start() {
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: VIDEO_W, height: VIDEO_H }, audio: false
        });
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        await video.play();
        await new Promise((res) => {
          const check = () => {
            if (video.videoWidth && video.videoHeight) { cameraReady = true; res(); }
            else requestAnimationFrame(check);
          };
          check();
        });
      }
      if (!landmarker) {
        const vision = await FilesetResolver.forVisionTasks(ASSETS_URL);
        landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL },
          runningMode: 'VIDEO',
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6,
          minHandPresenceConfidence: 0.5
        });
      }
      if (!faceLandmarker) {
        const vision = await FilesetResolver.forVisionTasks(ASSETS_URL);
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: FACE_MODEL_URL },
          runningMode: 'VIDEO',
          numFaces: 1,
          minFaceDetectionConfidence: 0.5,
          minFacePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        faceReady = true;
      }
      if (!running) {
        running = true;
        loop();
      }
    }

    function loop() {
      if (!running) return;
      draw().catch(console.warn).finally(() => { raf = requestAnimationFrame(loop); });
    }

    async function draw() {
      const vw = viewport.width = viewport.clientWidth * devicePixelRatio;
      const vh = viewport.height = viewport.clientHeight * devicePixelRatio;
      const now = performance.now();
      const dt = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.05) : 1 / 60;
      lastFrameTime = now;

      if (!cameraReady || video.readyState < 2) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, vw, vh);
        return;
      }

      let landmarks = null;
      try {
        const res = await landmarker.detectForVideo(video, performance.now());
        const hands = res?.landmarks ?? [];
        if (hands.length === 2) {
          landmarks = hands;
        }
      } catch (e) { /* skip frame */ }

      if (faceReady && faceLandmarker && faceSkipCounter === 0) {
        try {
          const faceRes = await faceLandmarker.detectForVideo(video, performance.now());
          faceLandmarks = faceRes?.faceLandmarks?.[0] ?? null;
        } catch (e) {
          faceLandmarks = null;
        }
      }
      faceSkipCounter = (faceSkipCounter + 1) % 2;

      ctx.drawImage(video, 0, 0, vw, vh);

      if (kamuiTrigger && faceLandmarks) {
        kamuiIntensity = Math.min(1, kamuiIntensity + KAMUI_FADE_SPEED * dt);
      } else {
        kamuiIntensity = Math.max(0, kamuiIntensity - KAMUI_FADE_SPEED * dt);
      }

      if (kamuiIntensity > 0.001 && faceLandmarks) {
        drawKamuiSpiral(vw, vh, kamuiIntensity, dt);
        drawKamuiGrade(vw, vh, kamuiIntensity);
        drawKamuiParticles(vw, vh, kamuiIntensity, dt);
        applyKamuiAberration(vw, vh, kamuiIntensity);
        applyKamuiDesaturate(vw, vh, kamuiIntensity);
      }

      if (!landmarks) {
        hud.textContent = buildHudText(false);
        return;
      }

      const tips = [];
      for (const hand of landmarks) {
        tips.push({ x: hand[4].x * VIDEO_W, y: hand[4].y * VIDEO_H });
        tips.push({ x: hand[8].x * VIDEO_W, y: hand[8].y * VIDEO_H });
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of tips) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const pad = 8;
      minX = Math.max(0, (minX - pad) | 0);
      minY = Math.max(0, (minY - pad) | 0);
      maxX = Math.min(VIDEO_W, (maxX + pad) | 0);
      maxY = Math.min(VIDEO_H, (maxY + pad) | 0);

      const regionW = maxX - minX;
      const regionH = maxY - minY;
      if (regionW < 4 || regionH < 4) {
        hud.textContent = buildHudText(false);
        return;
      }

      offscreen.width = regionW;
      offscreen.height = regionH;
      thermalBuf.width = regionW;
      thermalBuf.height = regionH;

      offCtx.drawImage(video,
        minX, minY, regionW, regionH,
        0, 0, regionW, regionH
      );
      const imgData = offCtx.getImageData(0, 0, regionW, regionH);
      applyThermal(imgData);
      thermalCtx.putImageData(imgData, 0, 0);

      const sx = vw / VIDEO_W;
      const sy = vh / VIDEO_H;
      const rx = minX * sx;
      const ry = minY * sy;
      const rw = regionW * sx;
      const rh = regionH * sy;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 4);
      ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(thermalBuf, 0, 0, regionW, regionH, rx, ry, rw, rh);
      ctx.restore();

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = 'rgba(0,255,255,0.6)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 3);
      ctx.stroke();
      ctx.shadowBlur = 0;

      const cbLen = 14, cbOff = 4;
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,255,255,0.5)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(rx + cbOff, ry); ctx.lineTo(rx + cbLen, ry);
      ctx.moveTo(rx, ry + cbOff); ctx.lineTo(rx, ry + cbLen);
      ctx.moveTo(rx + rw - cbLen, ry); ctx.lineTo(rx + rw - cbOff, ry);
      ctx.moveTo(rx + rw, ry + cbOff); ctx.lineTo(rx + rw, ry + cbLen);
      ctx.moveTo(rx + cbOff, ry + rh); ctx.lineTo(rx + cbLen, ry + rh);
      ctx.moveTo(rx, ry + rh - cbLen); ctx.lineTo(rx, ry + rh - cbOff);
      ctx.moveTo(rx + rw - cbLen, ry + rh); ctx.lineTo(rx + rw - cbOff, ry + rh);
      ctx.moveTo(rx + rw, ry + rh - cbLen); ctx.lineTo(rx + rw, ry + rh - cbOff);
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (const p of tips) {
        const px = p.x * sx;
        const py = p.y * sy;
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = 'rgba(0,255,255,0.7)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      hud.textContent = buildHudText(true);
    }

    function buildHudText(handsActive) {
      let text = handsActive ? 'JANELA ATIVA' : 'aguardando duas maos...';
      if (kamuiIntensity > 0.01 && faceLandmarks) {
        text += ' | KAMUI ACTIVE';
      } else if (faceLandmarks) {
        text += ' | KAMUI READY';
      }
      return text;
    }

    /* ─── Face oval helpers ─────────────────────────────────── */

    function getFaceOvalPoints(vw, vh) {
      return FACE_OVAL.map(idx => ({
        x: faceLandmarks[idx].x * vw,
        y: faceLandmarks[idx].y * vh
      }));
    }

    function getFaceCenter(pts) {
      let cx = 0, cy = 0;
      for (const p of pts) { cx += p.x; cy += p.y; }
      return { x: cx / pts.length, y: cy / pts.length };
    }

    function getFaceRadius(pts, center) {
      let r = 0;
      for (const p of pts) r += Math.hypot(p.x - center.x, p.y - center.y);
      return (r / pts.length) * 1.15;
    }

    function traceFaceOval(ctx, pts) {
      if (pts.length < 3) return;
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i].x + pts[i + 1].x) / 2;
        const my = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      const last = pts[pts.length - 1];
      const first = pts[0];
      ctx.quadraticCurveTo(last.x, last.y, first.x, first.y);
      ctx.closePath();
    }

    /* ─── Spiral ────────────────────────────────────────────── */

    function drawKamuiSpiral(vw, vh, intensity, dt) {
      const pts = getFaceOvalPoints(vw, vh);
      const center = getFaceCenter(pts);
      const radius = getFaceRadius(pts, center);

      const renderSize = Math.ceil(radius * 2.4);
      const bufSize = renderSize * 2;
      if (spiralBuf.width !== bufSize || spiralBuf.height !== bufSize) {
        spiralBuf.width = bufSize;
        spiralBuf.height = bufSize;
      }
      spiralCtx.clearRect(0, 0, bufSize, bufSize);
      spiralCtx.imageSmoothingEnabled = true;

      const spiralCx = bufSize / 2;
      const spiralCy = bufSize / 2;
      const maxTheta = KAMUI_TWIST * Math.PI * 2;
      const steps = Math.ceil(maxTheta / KAMUI_SPIRAL_STEP);

      /* --- glow pass (underneath, broad bloom) --- */
      for (let arm = 0; arm < KAMUI_ARMS; arm++) {
        const phase = (arm / KAMUI_ARMS) * Math.PI * 2;
        spiralCtx.beginPath();
        let first = true;
        for (let i = 0; i <= steps; i++) {
          const theta = i * KAMUI_SPIRAL_STEP;
          const t = theta / maxTheta;
          const r = t * radius;
          const angle = theta + phase + rotationOffset;
          const x = spiralCx + r * Math.cos(angle);
          const y = spiralCy + r * Math.sin(angle);
          if (first) { spiralCtx.moveTo(x, y); first = false; }
          else spiralCtx.lineTo(x, y);
        }
        const widthAtEdge = 8;
        const widthAtCenter = 1.5;
        const taperWidth = widthAtEdge - (widthAtEdge - widthAtCenter) * 0.5;
        spiralCtx.strokeStyle = '#ff6a00';
        spiralCtx.lineWidth = taperWidth;
        spiralCtx.lineCap = 'round';
        spiralCtx.lineJoin = 'round';
        spiralCtx.globalAlpha = intensity * 0.5;
        spiralCtx.shadowColor = '#ff6a00';
        spiralCtx.shadowBlur = 25;
        spiralCtx.stroke();
      }

      /* --- crisp tapered pass (on top, chunked for perf) --- */
      spiralCtx.shadowBlur = 0;
      const CHUNK = 18;
      for (let arm = 0; arm < KAMUI_ARMS; arm++) {
        const phase = (arm / KAMUI_ARMS) * Math.PI * 2;
        const color = arm % 2 === 0 ? KAMUI_ARM_COLOR : KAMUI_ARM_ALT;
        for (let start = 0; start <= steps; start += CHUNK) {
          const end = Math.min(start + CHUNK, steps);
          const midT = ((start + end) / 2) / steps;
          const w = 8 * (1 - midT) + 1;
          spiralCtx.beginPath();
          for (let i = start; i <= end; i++) {
            const theta = i * KAMUI_SPIRAL_STEP;
            const t = theta / maxTheta;
            const r = t * radius;
            const angle = theta + phase + rotationOffset;
            const x = spiralCx + r * Math.cos(angle);
            const y = spiralCy + r * Math.sin(angle);
            if (i === start) spiralCtx.moveTo(x, y);
            else spiralCtx.lineTo(x, y);
          }
          spiralCtx.strokeStyle = color;
          spiralCtx.lineWidth = w;
          spiralCtx.lineCap = 'round';
          spiralCtx.globalAlpha = intensity * (0.85 + 0.15 * (1 - midT));
          spiralCtx.stroke();
        }
      }

      /* --- radial crack lines at peak intensity --- */
      if (intensity > 0.7) {
        const crackAlpha = (intensity - 0.7) / 0.3;
        spiralCtx.globalAlpha = crackAlpha * 0.7;
        spiralCtx.strokeStyle = '#ff8c00';
        spiralCtx.lineWidth = 1.2;
        spiralCtx.lineCap = 'round';
        const rng = mulberry32(42);
        const crackCount = 8;
        for (let c = 0; c < crackCount; c++) {
          const spawnT = rng();
          const spawnTheta = spawnT * maxTheta;
          const spawnR = spawnT * radius;
          const baseAngle = spawnTheta + (rng() * 0.4 - 0.2) + rotationOffset;
          const cx = spiralCx + spawnR * Math.cos(baseAngle);
          const cy = spiralCy + spawnR * Math.sin(baseAngle);
          const segCount = 3 + (rng() * 3 | 0);
          spiralCtx.beginPath();
          spiralCtx.moveTo(cx, cy);
          let px = cx, py = cy;
          for (let s = 0; s < segCount; s++) {
            const len = 4 + rng() * 10;
            const dir = baseAngle + (rng() - 0.5) * 1.8;
            const nx = px + len * Math.cos(dir);
            const ny = py + len * Math.sin(dir);
            spiralCtx.lineTo(nx, ny);
            px = nx;
            py = ny;
          }
          spiralCtx.stroke();
        }
      }

      spiralCtx.globalAlpha = 1;
      spiralCtx.shadowBlur = 0;

      /* --- composite spiral through face oval with feathered edge --- */
      if (maskBuf.width !== bufSize || maskBuf.height !== bufSize) {
        maskBuf.width = bufSize;
        maskBuf.height = bufSize;
      }
      maskCtx.clearRect(0, 0, bufSize, bufSize);

      const ptsLocal = pts.map(p => ({
        x: p.x - (center.x - renderSize / 2),
        y: p.y - (center.y - renderSize / 2)
      }));
      maskCtx.beginPath();
      traceFaceOval(maskCtx, ptsLocal);
      maskCtx.closePath();
      maskCtx.fillStyle = '#fff';
      maskCtx.fill();

      maskCtx.globalCompositeOperation = 'destination-in';
      const featherPx = 6 * devicePixelRatio;
      const grad = maskCtx.createRadialGradient(
        spiralCx, spiralCy, Math.max(0, radius - featherPx),
        spiralCx, spiralCy, radius + featherPx * 0.5
      );
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.7, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      maskCtx.fillStyle = grad;
      maskCtx.fillRect(0, 0, bufSize, bufSize);

      spiralCtx.globalCompositeOperation = 'destination-in';
      spiralCtx.drawImage(maskBuf, 0, 0);
      spiralCtx.globalCompositeOperation = 'source-over';

      ctx.save();
      ctx.globalAlpha = intensity;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(spiralBuf, 0, 0, bufSize, bufSize,
        center.x - renderSize / 2, center.y - renderSize / 2, renderSize, renderSize);
      ctx.globalAlpha = 1;
      ctx.restore();

      /* --- face oval stroke (glowing outline) --- */
      ctx.save();
      ctx.globalAlpha = intensity;
      ctx.strokeStyle = KAMUI_ARM_COLOR;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = 'rgba(255,106,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      traceFaceOval(ctx, pts);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.restore();

      /* --- rotation: idle drift + acceleration toward 1 --- */
      const rotSpeed = KAMUI_IDLE_ROT_SPEED + (KAMUI_MAX_ROT_SPEED - KAMUI_IDLE_ROT_SPEED) * intensity;
      rotationOffset += rotSpeed * dt;
    }

    /* ─── Full-frame color grade + vignette ─────────────────── */

    function drawKamuiGrade(vw, vh, intensity) {
      ctx.save();

      /* desaturation underlay: low-alpha gray so orange pops more */
      ctx.globalAlpha = intensity * 0.08;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, vw, vh);

      /* warm radial grade */
      ctx.globalAlpha = intensity * 0.5;
      ctx.globalCompositeOperation = 'overlay';
      const grad = ctx.createRadialGradient(vw / 2, vh / 2, 0, vw / 2, vh / 2, Math.max(vw, vh) * 0.7);
      grad.addColorStop(0, '#ff6a00');
      grad.addColorStop(0.35, '#e8580c');
      grad.addColorStop(0.7, '#1a0a00');
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, vw, vh);
      ctx.globalCompositeOperation = 'source-over';

      /* deep vignette: edges go near-black */
      ctx.globalAlpha = intensity * 0.9;
      const vig = ctx.createRadialGradient(vw / 2, vh / 2, vw * 0.18, vw / 2, vh / 2, Math.max(vw, vh) * 0.72);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(0.45, 'rgba(0,0,0,0.15)');
      vig.addColorStop(0.7, 'rgba(0,0,0,0.5)');
      vig.addColorStop(1, 'rgba(0,0,0,0.88)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, vw, vh);

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* ─── Embers / particles ────────────────────────────────── */

    function drawKamuiParticles(vw, vh, intensity, dt) {
      if (intensity > 0.5) {
        const spawnRate = 6 + intensity * 18;
        const toSpawn = Math.min(MAX_PARTICLES - particles.length,
          Math.ceil(spawnRate * dt));
        for (let i = 0; i < toSpawn; i++) {
          particles.push(createEmber(vw, vh, intensity));
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.flickerPhase += p.flickerSpeed * dt;
        if (p.life <= 0 || p.y < -10) {
          particles.splice(i, 1);
          continue;
        }
        const lifeFade = Math.min(1, p.life / 0.4);
        const flicker = 0.6 + 0.4 * Math.sin(p.flickerPhase);
        const a = p.alpha * lifeFade * flicker;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.globalCompositeOperation = 'screen';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }

    function createEmber(vw, vh, intensity) {
      const colors = ['#ff6a00', '#ff8c00', '#e8580c', '#ffaa33'];
      const hue = Math.random();
      return {
        x: Math.random() * vw,
        y: vh * (0.6 + Math.random() * 0.4),
        vx: (Math.random() - 0.5) * 18,
        vy: -(20 + Math.random() * 50 + intensity * 30),
        size: 0.8 + Math.random() * 2,
        alpha: 0.25 + Math.random() * 0.55,
        life: 0.6 + Math.random() * 1.2,
        color: colors[Math.random() * colors.length | 0],
        flickerPhase: Math.random() * Math.PI * 2,
        flickerSpeed: 4 + Math.random() * 8
      };
    }

    /* ─── Chromatic aberration at high intensity ────────────── */

    function applyKamuiAberration(vw, vh, intensity) {
      if (intensity < 0.85) return;
      const abStr = (intensity - 0.85) / 0.15;
      const offset = Math.round(2 + abStr);
      if (frameBuf.width !== vw || frameBuf.height !== vh) {
        frameBuf.width = vw;
        frameBuf.height = vh;
      }
      frameCtx.drawImage(viewport, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = abStr * 0.18;
      ctx.drawImage(frameBuf, offset, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* ─── Desaturation outside warm area ────────────────────── */

    function applyKamuiDesaturate(vw, vh, intensity) {
      if (intensity < 0.15) return;
      ctx.save();
      ctx.globalAlpha = intensity * 0.06;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#555';
      ctx.fillRect(0, 0, vw, vh);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* ─── Thermal LUT (unchanged) ──────────────────────────── */

    function applyThermal(imgData) {
      const d = imgData.data;
      const len = d.length;
      for (let i = 0; i < len; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const lum = (r * 77 + g * 150 + b * 29) >> 8;
        const t = lum * 0.003921568627;
        const [cr, cg, cb] = thermalLut(t);
        d[i] = cr;
        d[i + 1] = cg;
        d[i + 2] = cb;
      }
    }

    function thermalLut(t) {
      let r, g, b;
      if (t < 0.20) {
        const f = t / 0.20;
        r = 15 + f * 21 | 0;
        g = 5 - f * 5 | 0;
        b = 29 + f * 41 | 0;
      } else if (t < 0.45) {
        const f = (t - 0.20) / 0.25;
        r = 36 - f * 36 | 0;
        g = f * 82 | 0;
        b = 70 + f * 185 | 0;
      } else if (t < 0.75) {
        const f = (t - 0.45) / 0.30;
        r = f * 57 | 0;
        g = 82 + f * 173 | 0;
        b = 255 - f * 235 | 0;
      } else {
        const f = (t - 0.75) / 0.25;
        r = 255 | 0;
        g = 255 - f * 255 | 0;
        b = 20 + f * 107 | 0;
      }
      return [r, g, b];
    }

    /* ─── Seeded PRNG for deterministic crack positions ─────── */

    function mulberry32(seed) {
      let s = seed;
      return () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    if (!('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices)) {
      enterBtn.disabled = true;
      boot.querySelector('p').textContent = 'Camera access required. Use a modern browser.';
    }
  </script>

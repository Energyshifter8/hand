<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingertip Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(0,255,255,0.85);
      font: 600 12px/1 "SF Mono", "Fira Code", ui-monospace, monospace;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(0,255,255,0.4), 0 0 28px rgba(0,255,255,0.15);
      pointer-events: none;
      text-align: center;
      white-space: pre;
      background: rgba(0,20,40,0.55);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 6px;
      padding: 8px 20px;
      backdrop-filter: blur(4px);
    }
    #boot {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.92);
      z-index: 20;
      text-align: center;
      gap: 16px;
    }
    #boot h1 {
      color: #7fdfff;
      font: 600 clamp(1.2rem, 3vw, 2.4rem)/1.2 "SF Mono", monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    #boot p {
      color: #7fa3c0;
      font: 14px/1.5 "SF Mono", monospace;
      max-width: 32ch;
    }
    #boot button {
      margin-top: 8px;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      background: rgba(14,30,50,0.9);
      color: #e8f3ff;
      font: 600 13px/1 "SF Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #boot button:hover { background: rgba(26,58,87,0.96); }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
    <div id="hud">aguardando duas maos...</div>
    <div id="boot">
      <h1>Fingertip Screen</h1>
      <p>Use thumb + index finger on both hands to create a collaborative thermal viewport.</p>
      <button id="enterBtn">INICIAR</button>
    </div>
  </div>

  <video id="video" playsinline muted style="display:none;"></video>
  <canvas id="offscreen" style="display:none;"></canvas>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const VIDEO_W = 1280;
    const VIDEO_H = 720;
    const MODEL_URL = 'https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task';
    const ASSETS_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';

    const video = document.getElementById('video');
    const viewport = document.getElementById('viewport');
    const offscreen = document.getElementById('offscreen');
    const ctx = viewport.getContext('2d');
    const offCtx = offscreen.getContext('2d');
    const hud = document.getElementById('hud');
    const boot = document.getElementById('boot');
    const enterBtn = document.getElementById('enterBtn');

    const thermalBuf = document.createElement('canvas');
    const thermalCtx = thermalBuf.getContext('2d');

    let landmarker = null;
    let stream = null;
    let running = false;
    let raf = null;
    let cameraReady = false;

    enterBtn.addEventListener('click', async () => {
      boot.style.display = 'none';
      await start();
    });

    async function start() {
      if (!stream) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: VIDEO_W, height: VIDEO_H }, audio: false
        });
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        await video.play();
        await new Promise((res) => {
          const check = () => {
            if (video.videoWidth && video.videoHeight) { cameraReady = true; res(); }
            else requestAnimationFrame(check);
          };
          check();
        });
      }
      if (!landmarker) {
        const vision = await FilesetResolver.forVisionTasks(ASSETS_URL);
        landmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL },
          runningMode: 'VIDEO',
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6,
          minHandPresenceConfidence: 0.5
        });
      }
      if (!running) {
        running = true;
        loop();
      }
    }

    function loop() {
      if (!running) return;
      draw().catch(console.warn).finally(() => { raf = requestAnimationFrame(loop); });
    }

    async function draw() {
      const vw = viewport.width = viewport.clientWidth * devicePixelRatio;
      const vh = viewport.height = viewport.clientHeight * devicePixelRatio;

      if (!cameraReady || video.readyState < 2) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, vw, vh);
        return;
      }

      let landmarks = null;
      try {
        const res = await landmarker.detectForVideo(video, performance.now());
        const hands = res?.landmarks ?? [];
        if (hands.length === 2) {
          landmarks = hands;
        }
      } catch (e) { /* skip frame */ }

      ctx.drawImage(video, 0, 0, vw, vh);

      if (!landmarks) {
        hud.textContent = 'aguardando duas maos...';
        return;
      }

      const tips = [];
      for (const hand of landmarks) {
        tips.push({ x: hand[4].x * VIDEO_W, y: hand[4].y * VIDEO_H });
        tips.push({ x: hand[8].x * VIDEO_W, y: hand[8].y * VIDEO_H });
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of tips) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      const pad = 8;
      minX = Math.max(0, (minX - pad) | 0);
      minY = Math.max(0, (minY - pad) | 0);
      maxX = Math.min(VIDEO_W, (maxX + pad) | 0);
      maxY = Math.min(VIDEO_H, (maxY + pad) | 0);

      const regionW = maxX - minX;
      const regionH = maxY - minY;
      if (regionW < 4 || regionH < 4) {
        hud.textContent = 'aguardando duas maos...';
        return;
      }

      offscreen.width = regionW;
      offscreen.height = regionH;
      thermalBuf.width = regionW;
      thermalBuf.height = regionH;

      offCtx.drawImage(video,
        minX, minY, regionW, regionH,
        0, 0, regionW, regionH
      );
      const imgData = offCtx.getImageData(0, 0, regionW, regionH);
      applyThermal(imgData);
      thermalCtx.putImageData(imgData, 0, 0);

      const sx = vw / VIDEO_W;
      const sy = vh / VIDEO_H;
      const rx = minX * sx;
      const ry = minY * sy;
      const rw = regionW * sx;
      const rh = regionH * sy;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 4);
      ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(thermalBuf, 0, 0, regionW, regionH, rx, ry, rw, rh);
      ctx.restore();

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = 'rgba(0,255,255,0.6)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(rx, ry, rw, rh, 3);
      ctx.stroke();
      ctx.shadowBlur = 0;

      const cbLen = 14, cbOff = 4;
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,255,255,0.5)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(rx + cbOff, ry); ctx.lineTo(rx + cbLen, ry);
      ctx.moveTo(rx, ry + cbOff); ctx.lineTo(rx, ry + cbLen);
      ctx.moveTo(rx + rw - cbLen, ry); ctx.lineTo(rx + rw - cbOff, ry);
      ctx.moveTo(rx + rw, ry + cbOff); ctx.lineTo(rx + rw, ry + cbLen);
      ctx.moveTo(rx + cbOff, ry + rh); ctx.lineTo(rx + cbLen, ry + rh);
      ctx.moveTo(rx, ry + rh - cbLen); ctx.lineTo(rx, ry + rh - cbOff);
      ctx.moveTo(rx + rw - cbLen, ry + rh); ctx.lineTo(rx + rw - cbOff, ry + rh);
      ctx.moveTo(rx + rw, ry + rh - cbLen); ctx.lineTo(rx + rw, ry + rh - cbOff);
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (const p of tips) {
        const px = p.x * sx;
        const py = p.y * sy;
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = 'rgba(0,255,255,0.7)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      hud.textContent = 'JANELA ATIVA';
    }

    function applyThermal(imgData) {
      const d = imgData.data;
      const len = d.length;
      for (let i = 0; i < len; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const lum = (r * 77 + g * 150 + b * 29) >> 8;
        const t = lum * 0.003921568627;
        const [cr, cg, cb] = thermalLut(t);
        d[i] = cr;
        d[i + 1] = cg;
        d[i + 2] = cb;
      }
    }

    function thermalLut(t) {
      let r, g, b;
      if (t < 0.20) {
        const f = t / 0.20;
        r = 15 + f * 21 | 0;
        g = 5 - f * 5 | 0;
        b = 29 + f * 41 | 0;
      } else if (t < 0.45) {
        const f = (t - 0.20) / 0.25;
        r = 36 - f * 36 | 0;
        g = f * 82 | 0;
        b = 70 + f * 185 | 0;
      } else if (t < 0.75) {
        const f = (t - 0.45) / 0.30;
        r = f * 57 | 0;
        g = 82 + f * 173 | 0;
        b = 255 - f * 235 | 0;
      } else {
        const f = (t - 0.75) / 0.25;
        r = 255 | 0;
        g = 255 - f * 255 | 0;
        b = 20 + f * 107 | 0;
      }
      return [r, g, b];
    }

    if (!('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices)) {
      enterBtn.disabled = true;
      boot.querySelector('p').textContent = 'Camera access required. Use a modern browser.';
    }
  </script>
</body>
</html>
